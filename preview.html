<!doctype html>

<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小圆 · 动画预览</title>
<style>body{margin:0;background:#f4f0fa;color:#302941;font:16px system-ui,sans-serif}main{max-width:850px;margin:40px auto;padding:24px}h1{font-size:32px;margin-bottom:4px}p{line-height:1.7}section{display:flex;gap:24px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:24px;padding:24px;margin:24px 0;box-shadow:0 10px 45px #55447712}canvas{width:288px;height:312px;border-radius:16px;background:repeating-conic-gradient(#ece8f2 0% 25%,#faf8fd 0% 50%) 0/24px 24px}canvas.dark{background:#304050}.controls{flex:1;min-width:220px}select,button,input{font:inherit}select,button{padding:10px;border:1px solid #d4c9e2;border-radius:10px;background:white;color:inherit}select{width:100%;margin:8px 0 16px}button{cursor:pointer;margin:6px 6px 6px 0}button:hover{background:#eee7fa}input{width:100%;margin:12px 0}small{color:#756882}a{color:#6a469e}#status{min-height:25px}</style></head>
<body><main><h1>小圆 · Xiaoyuan</h1><p>长发、黑框眼镜，陪你专注的小伙伴。</p><section><canvas id="pet" width="384" height="416" aria-label="小圆动画画面"></canvas><div class="controls"><label for="state">选择动作</label><select id="state"></select><button id="pause">暂停</button><button id="theme">切换背景</button><button id="tour">轮播动作</button><div id="directionArea" hidden><label for="direction">看向方向（顺时针）</label><input id="direction" type="range" min="0" max="15" value="0"><button id="spin">自动转头：开启</button></div><p id="status" role="status">载入中…</p><small>所有素材保留在本地，离线可用。</small></div></section><p><a href="README.md">项目说明</a> · <a href="previews/all-states.gif">完整 GIF</a> · <a href="previews/all-states.mp4">完整视频</a></p><small>素材：CC BY 4.0 · 预览代码：MIT</small></main>
<script>
const config={"name": "小圆", "version": "1.0.0", "spriteVersionNumber": 2, "image": "assets/xiaoyuan-spritesheet.png", "width": 1536, "height": 2288, "columns": 8, "rows": 11, "cellWidth": 192, "cellHeight": 208, "states": [{"name": "idle", "row": 0, "frames": 6, "durationsMs": [280, 110, 110, 140, 140, 320]}, {"name": "running-right", "row": 1, "frames": 8, "durationsMs": [120, 120, 120, 120, 120, 120, 120, 220]}, {"name": "running-left", "row": 2, "frames": 8, "durationsMs": [120, 120, 120, 120, 120, 120, 120, 220]}, {"name": "waving", "row": 3, "frames": 4, "durationsMs": [140, 140, 140, 280]}, {"name": "jumping", "row": 4, "frames": 5, "durationsMs": [140, 140, 140, 140, 280]}, {"name": "failed", "row": 5, "frames": 8, "durationsMs": [140, 140, 140, 140, 140, 140, 140, 240]}, {"name": "waiting", "row": 6, "frames": 6, "durationsMs": [150, 150, 150, 150, 150, 260]}, {"name": "running", "row": 7, "frames": 6, "durationsMs": [120, 120, 120, 120, 120, 220]}, {"name": "review", "row": 8, "frames": 6, "durationsMs": [150, 150, 150, 150, 150, 280]}], "lookDirections": [{"degrees": 0.0, "row": 9, "column": 0}, {"degrees": 22.5, "row": 9, "column": 1}, {"degrees": 45.0, "row": 9, "column": 2}, {"degrees": 67.5, "row": 9, "column": 3}, {"degrees": 90.0, "row": 9, "column": 4}, {"degrees": 112.5, "row": 9, "column": 5}, {"degrees": 135.0, "row": 9, "column": 6}, {"degrees": 157.5, "row": 9, "column": 7}, {"degrees": 180.0, "row": 10, "column": 0}, {"degrees": 202.5, "row": 10, "column": 1}, {"degrees": 225.0, "row": 10, "column": 2}, {"degrees": 247.5, "row": 10, "column": 3}, {"degrees": 270.0, "row": 10, "column": 4}, {"degrees": 292.5, "row": 10, "column": 5}, {"degrees": 315.0, "row": 10, "column": 6}, {"degrees": 337.5, "row": 10, "column": 7}]};
const labels=["待机 / Idle", "向右跑 / Run right", "向左跑 / Run left", "挥手 / Wave", "跳跃 / Jump", "失落 / Failed", "等待 / Waiting", "思考 / Working", "检查 / Review"];
const canvas=document.getElementById('pet'),ctx=canvas.getContext('2d'),selector=document.getElementById('state'),status=document.getElementById('status'),slider=document.getElementById('direction');
for(let i=0;i<labels.length;i++){const option=document.createElement('option');option.value=String(i);option.textContent=labels[i];selector.appendChild(option);}
const lookOption=document.createElement('option');lookOption.value='look';lookOption.textContent='看向方向 / Look around';selector.appendChild(lookOption);
let paused=false,spin=true,tour=false,frame=0,elapsed=0,tourTime=0,last=0;
const image=new Image();let loaded=false;
image.onload=()=>{loaded=true;requestAnimationFrame(loop);};image.onerror=()=>{status.textContent='图片未找到，请保留 assets 文件夹与 preview.html 的相对位置。';};image.src=config.image;
function reset(){frame=0;elapsed=0;tourTime=0;document.getElementById('directionArea').hidden=selector.value!=='look';}
selector.addEventListener('change',()=>{tour=false;reset();document.getElementById('tour').textContent='轮播动作';});
slider.addEventListener('input',()=>{spin=false;frame=Number(slider.value);document.getElementById('spin').textContent='自动转头：关闭';});
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续':'暂停';};
document.getElementById('theme').onclick=()=>canvas.classList.toggle('dark');
document.getElementById('spin').onclick=()=>{spin=!spin;document.getElementById('spin').textContent='自动转头：'+(spin?'开启':'关闭');};
document.getElementById('tour').onclick=()=>{tour=!tour;tourTime=0;document.getElementById('tour').textContent=tour?'停止轮播':'轮播动作';};
function loop(now){const dt=last?Math.min(now-last,100):0;last=now;const look=selector.value==='look';if(!paused){elapsed+=dt;tourTime+=dt;if(look){if(spin&&elapsed>=200){frame=(frame+1)%16;slider.value=String(frame);elapsed%=200;}else if(!spin){frame=Number(slider.value);}}else{const state=config.states[Number(selector.value)];while(elapsed>=state.durationsMs[frame]){elapsed-=state.durationsMs[frame];frame=(frame+1)%state.frames;}}if(tour&&tourTime>=3000){const next=(selector.selectedIndex+1)%selector.options.length;selector.selectedIndex=next;reset();}}
const isLook=selector.value==='look';const row=isLook?9+Math.floor(frame/8):config.states[Number(selector.value)].row;const col=isLook?frame%8:frame;ctx.clearRect(0,0,canvas.width,canvas.height);if(loaded)ctx.drawImage(image,col*192,row*208,192,208,0,0,384,416);status.textContent=isLook?'方向：'+(frame*22.5)+'°':labels[Number(selector.value)]+' · 第 '+(frame+1)+' 帧';requestAnimationFrame(loop);}
</script></body></html>
